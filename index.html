<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1730">
<title>Block Escape Rooms</title>
<style>:root{--bg:#0e1730;--ink:#16263d;--pan:#15244a;--pan2:#203669;--tx:#eef4ff;--mu:#a9bbdc;--teal:#2fe0d0;--lime:#b6f542;--org:#ff9f1c;--red:#ff5a5f;--gold:#ffd23f;
 --wall1:#3b4f7a;--wall2:#34476e;--floor1:#6b7a8f;--floor2:#5d6b80;--acc:#2fe0d0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h1,h2,h3,.hd{font-family:"Arial Black","Arial Rounded MT Bold",Impact,system-ui,sans-serif;font-weight:900;margin:0;letter-spacing:.3px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
#app{height:100%}
.page{height:100%;overflow:auto;padding:14px 16px 24px;background-image:linear-gradient(rgba(63,167,255,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(63,167,255,.07) 2px,transparent 2px);background-size:40px 40px}
.btn{background:var(--teal);color:#05202a;border:0;border-bottom:5px solid #12958a;border-radius:12px;padding:9px 16px;font-weight:800;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.g{background:var(--pan2);color:var(--tx);border-bottom-color:#0d1d3c}.btn.o{background:var(--org);color:#2a1700;border-bottom-color:#b86d00}.btn.r{background:#ff6b6b;color:#2a0000;border-bottom-color:#b03030}.btn.y{background:var(--gold);color:#2a2000;border-bottom-color:#b8960a}
.btn[disabled]{opacity:.45;pointer-events:none}
/* ---------- home ---------- */
.home{max-width:1240px;margin:0 auto}
.logo{text-align:center;margin:6px 0 2px}
.logo h1{font-size:clamp(30px,5vw,54px);line-height:1;color:var(--lime);text-shadow:4px 4px 0 #1f6b2a,8px 8px 0 rgba(0,0,0,.35)}
.logo h1 span{color:var(--gold);text-shadow:4px 4px 0 #8a6d00,8px 8px 0 rgba(0,0,0,.35)}
.logo p{color:var(--mu);margin:8px 0 14px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,370px),1fr));gap:14px}
.rc{position:relative;background:var(--pan);border:3px solid var(--pan2);border-bottom:9px solid #0b1733;border-radius:18px;padding:14px;display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.rc:hover{border-color:var(--teal)}.rc:active{transform:translateY(3px)}
.rc .ri{font-size:46px;width:72px;height:72px;display:grid;place-items:center;border-radius:14px;background:var(--c);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);flex:none}
.rc h2{font-size:21px}.rc .bl{font-size:13.5px;color:#d6e2ff;margin-top:2px}.rc .s{color:var(--mu);font-size:14px}.rc .m{font-size:13px;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lvl{letter-spacing:2px;color:var(--org)}.esc{color:var(--lime);font-weight:700}
.rc .nx{position:absolute;top:-10px;right:12px;background:var(--gold);color:#2a2000;font-weight:900;font-size:12px;border-radius:8px;padding:2px 8px;border-bottom:3px solid #b8960a}
.hbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.tip{color:var(--mu);text-align:center;font-size:14px;margin-top:12px}
/* ---------- room view ---------- */
.rv{height:100%;display:grid;grid-template-columns:1fr clamp(270px,25vw,350px);grid-template-rows:auto 1fr;grid-template-areas:"top top" "stage side";gap:8px;padding:8px;overflow:hidden}
.rtop{grid-area:top;display:flex;align-items:center;gap:8px;min-width:0}
.ib{background:var(--pan2);border:0;border-bottom:4px solid #0d1d3c;border-radius:11px;min-height:44px;min-width:44px;padding:0 12px;font-weight:800;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ib:active{transform:translateY(2px);border-bottom-width:2px}.ib.hint{background:var(--gold);color:#2a2000;border-bottom-color:#b8960a}
.pulse{animation:pu 1.2s ease-in-out infinite}@keyframes pu{50%{box-shadow:0 0 0 6px rgba(255,210,63,.45);transform:scale(1.06)}}
.rname{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lbar{display:flex;align-items:center;gap:4px;background:var(--pan);border-radius:11px;padding:5px 10px;flex:1;min-width:0;max-width:420px}
.lbar .tr{flex:1;height:14px;background:#0b1530;border-radius:7px;overflow:hidden;min-width:40px}.lbar .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--lime));border-radius:7px;transition:width .6s}
.lbar b{font-size:14px;white-space:nowrap}
.sp{flex:1}
.tmr{background:var(--pan);border-radius:11px;padding:6px 10px;font-weight:800;white-space:nowrap;font-size:14px}.tmr small{color:var(--mu);font-weight:600}
.stagew{grid-area:stage;container-type:size;min-height:0;display:grid;place-items:center}
.scene{position:relative;width:min(100cqw,170cqh);height:min(100cqh,72cqw);border-radius:16px;overflow:hidden;border:4px solid #0a1228;
 background:linear-gradient(to bottom,transparent 62%,rgba(0,0,0,.35) 62%,transparent 63.5%),
 repeating-linear-gradient(90deg,var(--floor1) 0 6%,var(--floor2) 6% 12%) bottom/100% 38% no-repeat,
 linear-gradient(var(--wall2) 2px,transparent 2px) 0 0/100% 8.3% ,
 linear-gradient(90deg,var(--wall2) 2px,transparent 2px) 0 0/8% 16.6%,var(--wall1);container-type:size}
.scene:after{content:"";position:absolute;left:0;right:0;top:62%;height:38%;background:linear-gradient(rgba(0,0,0,.18),transparent 30%);pointer-events:none}
.ob{position:absolute;border:0;padding:0;background:var(--c);border-radius:8px;box-shadow:inset 0 -7px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.25),0 5px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:visible;z-index:2;transition:transform .12s,filter .12s}
.ob:before{content:"";position:absolute;left:8%;right:8%;top:-5px;height:7px;background:radial-gradient(circle at 50% 60%,var(--c) 55%,transparent 60%) 0 0/16px 7px repeat-x;filter:brightness(1.12)}
.ob:hover{filter:brightness(1.12);transform:translateY(-2px)}.ob:active{transform:translateY(2px)}
.ob .ic{font-size:min(7cqw,11cqh);line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.ob .nm{font-size:clamp(9px,1.55cqw,14px);font-weight:800;background:rgba(10,18,40,.78);color:#fff;border-radius:6px;padding:1px 6px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ob .bd{position:absolute;top:-8px;right:-6px;font-size:clamp(11px,1.6cqw,16px);background:#0b1530;border-radius:50%;width:1.7em;height:1.7em;display:grid;place-items:center;border:2px solid #fff3}
.ob.new .bd{background:var(--gold);border-color:#fff;color:#2a2000;font-weight:900}
.ob.open{outline:3px solid rgba(182,245,66,.8);outline-offset:-3px}
.ob.k-door{box-shadow:inset 0 -7px 0 rgba(0,0,0,.3),inset 0 0 0 5px rgba(0,0,0,.18),0 5px 0 rgba(0,0,0,.25)}
.ob.k-decor .nm,.ob.k-trap .nm{opacity:.85}
.side{grid-area:side;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.card{background:var(--pan);border:2px solid var(--pan2);border-radius:14px;padding:9px 11px}
.lbl{font-family:"Arial Black",Impact,sans-serif;font-size:12px;color:var(--teal);letter-spacing:.6px;display:flex;align-items:center;gap:6px;margin-bottom:5px}
.lbl .sp{flex:1}.lbl button{font-family:system-ui;font-size:13px;font-weight:800;background:var(--pan2);border:0;border-bottom:3px solid #0d1d3c;border-radius:8px;padding:5px 9px;color:var(--tx);min-height:34px}
.lbl button.on{background:var(--org);color:#2a1700}
.goal .gt{font-size:17px;font-weight:800;line-height:1.3}.goal .gl{display:flex;gap:4px;margin-top:6px}.goal .gl i{flex:1;height:6px;border-radius:3px;background:#0b1530}.goal .gl i.d{background:var(--lime)}
.pcl{display:flex;flex-wrap:wrap;gap:6px}
.pc{background:#0b1530;border:3px solid var(--c);border-radius:10px;padding:2px 9px;text-align:center;min-width:52px;animation:pop .4s}
.pc small{display:block;font-size:10.5px;color:var(--mu);font-weight:700;line-height:1.2}.pc b{font-size:20px;color:var(--c);font-family:ui-monospace,Menlo,monospace}
.pc b .fr{font-size:15px}.pc .yr{font-size:11px;color:#ffe4a3}
.empty{color:var(--mu);font-size:13px;grid-column:1/-1}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.slot{background:#0b1530;border:2px solid #2b447a;border-radius:10px;min-height:64px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;line-height:1.15;text-align:center}
.slot span{font-size:26px;line-height:1.1}.slot.sel{border-color:var(--org);background:#3a2400}.slot.newi{animation:pop .5s}
.nts textarea{width:100%;min-height:70px;height:100%;resize:none;background:#fff8d6;color:#3a2f00;border:3px solid #c9a400;border-radius:10px;padding:7px 9px;font:600 15px/1.45 ui-monospace,Menlo,monospace}
.nts{flex:1;display:flex;flex-direction:column;min-height:120px}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(3,8,20,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.md{background:#fff;color:var(--ink);border-radius:18px;width:100%;max-width:660px;max-height:calc(100dvh - 24px);overflow:auto;padding:0 0 16px;box-shadow:0 10px 0 rgba(0,0,0,.35);border:4px solid #0a1228}
.md.wide{max-width:1060px}
.mh{position:sticky;top:0;background:#eef3ff;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:3px solid #d5def0;z-index:3}
.mh .e{font-size:30px}.mh h2{font-size:20px;color:#0b2a66;flex:1}
.x{background:#dfe7f6;border:0;border-bottom:3px solid #b8c5de;border-radius:10px;min-width:44px;min-height:44px;font-weight:900;font-size:18px;color:var(--ink)}
.mb{padding:12px 16px 0}
.mb p{margin:8px 0}.wp{font-size:17px;line-height:1.55}
.note{background:#fff8d6;border:2px dashed #c9a400;border-radius:10px;padding:8px 12px;margin:8px 0;line-height:1.6}
.scr{background:#0d1b33;color:#9ff5e9;border-radius:12px;padding:10px 14px;font-family:ui-monospace,Menlo,monospace;border:3px solid #2b447a}
.scr .wp,.scr p{color:#c8fff6}.scr b{color:#fff}
.chalk{background:#2f5d3a;color:#fff;border-radius:12px;padding:10px 14px;border:6px solid #8e5a2b}
.big{font-size:clamp(22px,4vw,34px);font-weight:800;text-align:center;margin:10px 0;letter-spacing:1px}
.ctr{display:flex;justify-content:center}
svg.grid,svg.shape{max-width:100%;height:auto}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 3px;font-size:.95em;font-weight:800}
.fr span:first-child{border-bottom:2.5px solid currentColor;padding:0 4px 1px}.fr span:last-child{padding:1px 4px 0}
.mx{display:inline-flex;align-items:center;font-weight:800}
.stk{border-collapse:collapse;font:800 22px/1.25 ui-monospace,Menlo,monospace;margin:8px auto;background:#f3f7ff;border-radius:10px}
.stk td{padding:0}.stk td.op{padding:0 10px 0 8px;text-align:left;color:#c0392b}.stk td.i{text-align:right;padding-left:10px}.stk td.f{text-align:left;padding-right:12px}
.stk tr.ln td{border-bottom:3px solid var(--ink)}
.rcpt{background:#fffdf6;border:2px solid #d9cfae;border-radius:8px;padding:10px 14px;max-width:440px;margin:6px auto;box-shadow:0 4px 0 #e6dcc0}
.rcpt .rt{text-align:center;font-weight:900;letter-spacing:2px;border-bottom:2px dashed #b9ad8a;padding-bottom:4px;margin-bottom:4px}
.rcpt table{width:100%;border-collapse:collapse;font:700 18px/1.5 ui-monospace,Menlo,monospace}.rcpt td.l{font:600 16px system-ui;padding-right:8px}.rcpt td{padding:0}.rcpt td.i{text-align:right;width:1%;white-space:nowrap;padding:0}.rcpt td.f{text-align:left;width:3.2em;padding:0}
.rcpt .rf{border-top:2px dashed #b9ad8a;margin-top:4px;padding-top:6px;font-size:16px}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.seq b{background:#e8f1ff;border:3px solid #7aa6e8;border-bottom-width:6px;border-radius:10px;padding:6px 12px;font:800 24px ui-monospace,Menlo,monospace;min-width:52px;text-align:center}
.abc{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin:8px 0}.abc span{background:#eef3ff;color:#16263d;border-radius:6px;text-align:center;font:700 12px ui-monospace,Menlo,monospace;padding:2px 0;line-height:1.2}.abc b{display:block;font-size:15px;color:#0b2a66}
.cph{font-size:19px;line-height:1.9;padding-left:28px;margin:6px 0}.cph li{white-space:nowrap}.scr .cph{color:#fff}
.clocks{display:flex;gap:12px;justify-content:center}.clocks div{background:#101c34;color:#7dff9a;border-radius:12px;padding:8px 16px;text-align:center;border:3px solid #2b447a}.clocks small{display:block;color:#a9bbdc}.clocks b{font-size:26px}
.flags{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}.flag{background:var(--c);border-radius:6px 14px 14px 6px;padding:8px 14px;min-width:84px;text-align:center;color:#111;border-left:6px solid #5b3a1a;box-shadow:0 4px 0 rgba(0,0,0,.25)}.flag span{display:block;font-size:14px}.flag b{font-size:24px}
.cchip{display:inline-block;background:var(--c);color:#111;font-weight:800;border-radius:8px;padding:0 8px;margin:1px 2px;font-size:.92em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);white-space:nowrap}
.maze{border-collapse:separate;border-spacing:4px;margin:4px auto}.maze td{width:46px;height:42px;text-align:center;background:#2a2a48;color:#ffd0d0;font:800 18px ui-monospace,Menlo,monospace;border-radius:6px;box-shadow:inset 0 0 0 2px #ff4d4d55}
.maze td.st{background:#2e8b57;color:#fff}.maze td.en{background:#c9a227;color:#222}
.got{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.got div{background:#e9fbf0;border:3px solid #2ea86a;border-radius:12px;padding:6px 12px;font-weight:800;animation:pop .5s}.got span{font-size:26px;vertical-align:middle;margin-right:4px}
.usebar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.usebar button{background:#eef3ff;border:2px solid #9fb4d8;border-bottom-width:5px;border-radius:12px;padding:6px 12px;min-height:50px;font-weight:800;color:var(--ink)}.usebar button span{font-size:24px;vertical-align:middle;margin-right:4px}
.msg{min-height:26px;font-weight:800;margin:6px 0}.bad{color:#c62828}.good{color:#14783f}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* ---------- lock modal ---------- */
.lkg{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;padding:12px 14px 0}
.cluep{background:#f6f8fd;border:2px solid #d5def0;border-radius:14px;padding:8px 10px;min-width:0;max-height:calc(100dvh - 130px);overflow:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.tabs button{background:#e3eaf7;border:0;border-bottom:3px solid #b8c5de;border-radius:9px;padding:4px 9px;font-size:13px;font-weight:800;min-height:36px;color:var(--ink)}.tabs button.on{background:#0b2a66;color:#fff;border-bottom-color:#051634}
.lockp{min-width:0}.lp{font-size:17px;font-weight:700;margin:2px 0 8px}
.mech{background:#1b2440;border-radius:16px;padding:12px;color:#fff;border-bottom:6px solid #0b1228}
.kd{background:#0b1a10;color:#7dff9a;font:800 32px ui-monospace,Menlo,monospace;border-radius:10px;padding:6px 12px;text-align:right;min-height:54px;letter-spacing:3px;border:3px solid #2e5a3a;margin-bottom:8px;overflow:hidden}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.keys button,.pal button,.dpad button{background:#3a4a78;border:0;border-bottom:5px solid #1c2647;border-radius:11px;min-height:52px;font:800 24px system-ui;color:#fff}
.keys button:active,.pal button:active,.dpad button:active,.whl button:active{transform:translateY(3px);border-bottom-width:2px}
.go{width:100%;margin-top:9px;background:var(--lime);color:#173000;border:0;border-bottom:6px solid #5f9a12;border-radius:12px;min-height:54px;font:900 20px "Arial Black",system-ui}
.go:active{transform:translateY(3px);border-bottom-width:3px}
.dials{display:flex;gap:8px;justify-content:center;align-items:center}
.whl{display:flex;flex-direction:column;align-items:center;gap:4px}
.whl button{background:#3a4a78;border:0;border-bottom:4px solid #1c2647;border-radius:10px;width:58px;min-height:44px;font-size:20px;color:#fff}
.whl b{width:58px;height:62px;display:grid;place-items:center;background:linear-gradient(#c9a227,#fff2a8 45%,#fff2a8 55%,#c9a227);color:#2a1d00;font:900 34px ui-monospace,Menlo,monospace;border-radius:8px;border:3px solid #6b5100}
.dsep{font:900 30px ui-monospace,Menlo,monospace;color:#ffd23f}
.slotsr{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:46px;margin-bottom:9px}
.slotsr i{width:40px;height:40px;border-radius:9px;border:3px dashed #5a6a98;display:grid;place-items:center;font-style:normal;font-size:22px;font-weight:900}
.slotsr i.f{border-style:solid;border-color:#fff;background:var(--c,#3a4a78)}
.pal{display:flex;gap:6px}.pal button{flex:1;background:var(--c);color:#111;font-size:15px;min-width:0;padding:0 2px;border-bottom-color:rgba(0,0,0,.35)}
.pal button span{display:block;font-size:20px;line-height:1}
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:7px;justify-content:center}
.dpad [data-d=U]{grid-column:2;grid-row:1}.dpad [data-d=L]{grid-column:1;grid-row:2}.dpad [data-d=D]{grid-column:2;grid-row:2}.dpad [data-d=R]{grid-column:3;grid-row:2}
.erow{display:flex;gap:7px;margin-top:8px}.erow button{flex:1;background:#5a3a4a;border:0;border-bottom:4px solid #2c1a24;border-radius:10px;min-height:42px;font-weight:800;color:#fff}
.hrow{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.hint{background:#e9fbf0;border-left:6px solid #2ea86a;border-radius:8px;padding:7px 11px;margin:7px 0;font-size:15.5px;animation:fin .35s}@keyframes fin{from{opacity:0}to{opacity:1}}
.hint b{display:block;font-size:12px;color:#14783f;letter-spacing:.5px}
.hint .stk{font-size:19px}
/* ---------- fx ---------- */
#fx{position:fixed;inset:0;z-index:80;pointer-events:none;display:none;align-items:center;justify-content:center}
#fx.on{display:flex}
.plk{width:150px;height:170px;position:relative;animation:pop .35s}
.plk .sh{position:absolute;left:30px;top:0;width:90px;height:90px;border:18px solid #c9d3e6;border-bottom:0;border-radius:50px 50px 0 0;transform-origin:85% 100%;animation:shk .5s .25s forwards}
.plk .bo{position:absolute;left:0;bottom:0;width:150px;height:105px;background:linear-gradient(#ffd23f,#e0a800);border-radius:18px;border-bottom:10px solid #9a7400;display:grid;place-items:center;font:900 22px "Arial Black",sans-serif;color:#4a3500}
@keyframes shk{to{transform:translateY(-26px) rotate(28deg)}}
.cf{position:fixed;width:14px;height:14px;border-radius:3px;z-index:81;pointer-events:none;animation:cf 1.3s ease-out forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#16263d;border:3px solid var(--org);border-radius:12px;padding:10px 16px;z-index:90;text-align:center;max-width:min(560px,92vw);font-weight:700;animation:pop .3s}
/* ---------- grown-up / workshop ---------- */
.wrap{max-width:1100px;margin:0 auto}
.topb{display:flex;gap:10px;align-items:center;margin-bottom:12px}.topb h1{font-size:24px;color:var(--lime);flex:1}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}

function gridSvg(n,pts=[],o={}){const c=24,pad=26,W=pad+n*c+12;let s=`<svg viewBox="0 0 ${W} ${W}" class="grid" width="${o.w||260}">`;

const TOPICS={ooo:'Order of operations',word:'Multi-step word problems',frac:'Fractions',dec:'Decimals & money',fpm:'Factors, primes & multiples',pattern:'Patterns',geo:'Area, perimeter & volume',time:'Elapsed time',coord:'Coordinate grids',logic:'Logic & ciphers',stretch:'Stretch (6th–7th grade)'};
const GEN={};
GEN.ooo={topic:'ooo',make(D){let e,v,h2,h3;
 if(D==1){const a=ri(3,12),b=ri(3,9),c=ri(7,15),d=ri(1,c-3);v=a+b*(c-d);e=`${a} + ${b} × (${c} − ${d})`;h2=`Brackets first: ${c} − ${d} = ${c-d}. Now it is ${a} + ${b} × ${c-d}.`;h3=`Multiply before adding: ${b} × ${c-d} = ${b*(c-d)}. Last step: ${a} + ${b*(c-d)} = ?`;}
 else if(D==2){const p=ri(9,16),q=ri(2,p-3),k=ri(3,9),x=(p-q)*k,r=ri(2,6),s=ri(4,25);v=k*r+s;e=`${x} ÷ (${p} − ${q}) × ${r} + ${s}`;h2=`Brackets: ${p} − ${q} = ${p-q}. Now ${x} ÷ ${p-q} × ${r} + ${s}. Do × and ÷ from left to right.`;h3=`${x} ÷ ${p-q} = ${k}, then ${k} × ${r} = ${k*r}. Last: ${k*r} + ${s} = ?`;}
 else{let a,b,c,d,f,m;do{a=ri(6,12);b=ri(2,9);c=ri(2,9);d=ri(1,8);f=ri(2,6);m=b*(c+d)/f;}while(m%1||a*a-m<=0);v=a*a-m;e=`${a}² − ${b} × (${c} + ${d}) ÷ ${f}`;h2=`${a}² means ${a} × ${a} = ${a*a}. Brackets: ${c} + ${d} = ${c+d}.`;h3=`${b} × ${c+d} = ${b*(c+d)}, then ÷ ${f} = ${m}. Last: ${a*a} − ${m} = ?`;}
 return {clue:`<div class="big mono">${e}</div>`,prompt:'Find the value of the expression.',ans:String(v),hints:['Not everything goes left to right. Order: brackets, then powers, then × and ÷ (left to right), then + and − (left to right).',h2,h3]};}};
GEN.pattern={topic:'pattern',make(D){const t=pick(D==1?['x2p','grow','alt']:D==2?['x2p','grow','alt','sq']:['sq','fib','alt','x3m']);let a=[],n,r,h2,h3;
 if(t=='x2p'){const c=ri(1,3);a=[ri(2,6)];while(a.length<5)a.push(a.at(-1)*2+c);n=a.at(-1)*2+c;r=`double it, then add ${c}`;h2=`Try doubling: ${a[0]} × 2 = ${a[0]*2}. How far is that from ${a[1]}?`;h3=`Rule: double, then add ${c}. ${a.at(-1)} × 2 = ${a.at(-1)*2}, then + ${c} = ?`;}
 else if(t=='grow'){const k=ri(1,3);let j=ri(2,5);a=[ri(3,20)];while(a.length<6){a.push(a.at(-1)+j);j+=k;}n=a.at(-1)+j;r='jumps grow';h2=`Write the jumps: +${a[1]-a[0]}, +${a[2]-a[1]}, +${a[3]-a[2]}... The jumps grow by ${k} each time.`;h3=`The last jump was +${a[5]-a[4]}, so the next jump is +${j}. ${a.at(-1)} + ${j} = ?`;}
 else if(t=='alt'){const m=ri(2,3),s=ri(1,4);a=[ri(3,9)];let i=0;while(a.length<6){a.push(i%2==0?a.at(-1)*m:a.at(-1)-s);i++;}n=i%2==0?a.at(-1)*m:a.at(-1)-s;r='two moves take turns';h2=`Two different moves take turns. ${a[0]} → ${a[1]} is one move, ${a[1]} → ${a[2]} is another.`;h3=`The moves are "× ${m}" then "− ${s}", over and over. The next move is ${i%2==0?'× '+m:'− '+s}: ${a.at(-1)} ${i%2==0?'×':'−'} ${i%2==0?m:s} = ?`;}
 else if(t=='sq'){const c=ri(1,9),s=ri(2,6);for(let k=s;k<s+5;k++)a.push(k*k+c);n=(s+5)*(s+5)+c;h2=`Look for square numbers (4, 9, 16, 25...) hiding inside: ${a[0]} − ${c} = ${s*s}.`;h3=`Each number is a square plus ${c}: ${s}² + ${c}, ${s+1}² + ${c}... Next is ${s+5}² + ${c} = ${(s+5)*(s+5)} + ${c} = ?`;}

 else{a=[ri(2,4)];while(a.length<5)a.push(a.at(-1)*3-1);n=a.at(-1)*3-1;h2=`Try multiplying: ${a[0]} × 3 = ${a[0]*3}. How far is that from ${a[1]}?`;h3=`Rule: × 3, then − 1. ${a.at(-1)} × 3 = ${a.at(-1)*3}, then − 1 = ?`;}

const THEMES={lab:{thing:'crystals',box:'crates',crew:'robots',place:'lab machine'},pirate:{thing:'gold coins',box:'chests',crew:'pirates',place:'ship'},space:{thing:'energy cells',box:'pods',crew:'astronauts',place:'station'},museum:{thing:'gems',box:'cases',crew:'guards',place:'gallery'},school:{thing:'markers',box:'boxes',crew:'teams',place:'classroom'}};
GEN.word={topic:'word',make(D,o){const T=THEMES[o.theme||'lab'];let q,v,h2,h3;

function mkMech(L,draft){const m={type:L.type,len:L.len||0,L};
 if(L.type=='keypad')m.s=draft&&draft.s||'';
 if(L.type=='dial')m.d=draft&&draft.d?draft.d.slice():Array(L.len).fill(0);
 if(L.type=='color'||L.type=='dir')m.seq=draft&&draft.seq?draft.seq.slice():[];
 if(L.type=='word'){m.sets=L.sets;m.w=draft&&draft.w?draft.w.slice():L.sets.map((st,i)=>{let k;do{k=Math.floor(Math.random()*st.length);}while(st[k]==L.ans[i]&&st.length>1);return k;});m.cur=0;}
 return m;}
function wordSets(ans){return [...ans].map(ch=>{const o=new Set([ch]);while(o.size<8)o.add(LET[Math.floor(Math.random()*26)]);return [...o].sort();});}
function mechHtml(m){const L=m.L;
 if(m.type=='keypad')return `<div class="kd" id="kd">${m.s||'&nbsp;'}</div><div class="keys">${['7','8','9','4','5','6','1','2','3','.','0','⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div><button class="go" id="lkGo">✔ Try it</button>`;
 if(m.type=='dial')return `<div class="dials">${m.d.map((d,i)=>`${L.sep&&i==L.sep?'<span class="dsep">:</span>':''}<div class="whl"><button data-up="${i}" aria-label="up">▲</button><b>${d}</b><button data-dn="${i}" aria-label="down">▼</button></div>`).join('')}</div><button class="go" id="lkGo">✔ Pull the handle</button>`;
 if(m.type=='color')return `<div class="slotsr">${Array.from({length:m.len},(_,i)=>{const c=m.seq[i];return c?`<i class="f" style="--c:${COLORS[c].c}">${COLORS[c].s}</i>`:'<i></i>';}).join('')}</div><div class="pal">${L.colors.map(c=>`<button data-c="${c}" style="--c:${COLORS[c].c}"><span>${COLORS[c].s}</span>${COLORS[c].n}</button>`).join('')}</div><div class="erow"><button data-x="back">⌫ Undo</button><button data-x="clr">Clear</button></div><button class="go" id="lkGo">✔ Try it</button>`;
 if(m.type=='dir')return `<div class="slotsr">${Array.from({length:Math.max(m.len,m.seq.length)},(_,i)=>{const d=m.seq[i];return d?`<i class="f">${dirTxt([d])}</i>`:'<i></i>';}).join('')}</div><div class="dpad">${['U','L','D','R'].map(d=>`<button data-d="${d}">${dirTxt([d])}</button>`).join('')}</div><div class="erow"><button data-x="back">⌫ Undo</button><button data-x="clr">Clear</button></div><button class="go" id="lkGo">✔ Try it</button>`;
 if(m.type=='word')return `<div class="dials">${m.w.map((k,i)=>`<div class="whl"><button data-wu="${i}" aria-label="up">▲</button><b>${m.sets[i][k]}</b><button data-wd="${i}" aria-label="down">▼</button></div>`).join('')}</div><button class="go" id="lkGo">✔ Pull the handle</button>`;}
function mechVal(m){return m.type=='keypad'?m.s:m.type=='dial'?m.d.join(''):m.type=='word'?m.w.map((k,i)=>m.sets[i][k]).join(''):m.type=='color'?m.seq.join(','):m.seq.join('');}
function mechEq(L,v){if(L.type=='keypad'){if(!v||v=='.')return false;if(/^0\d/.test(L.ans))return v===L.ans;return Math.abs(parseFloat(v)-parseFloat(L.ans))<0.0001;}return v===L.ans;}
function bindMech(box,m,onTry){const re=()=>{box.innerHTML=mechHtml(m);bindMech(box,m,onTry);};
 box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{SFX.click();const k=b.dataset.k;if(k=='⌫')m.s=m.s.slice(0,-1);else if(m.s.length<9&&!(k=='.'&&m.s.includes('.')))m.s+=k;box.querySelector('#kd').innerHTML=m.s||'&nbsp;';});

 else if(m.type=='dial'){if(/^[0-9]$/.test(k)){m.d[m.cur||0]=+k;m.cur=((m.cur||0)+1)%m.len;M.box.innerHTML=mechHtml(m);bindMech(M.box,m,M.onTry);}}
